<!doctype html>
<html lang="en" data-preset="amber">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>%sveltekit.error.message%</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand: oklch(0.72 0.18 55);
      --surface: oklch(0.97 0.008 85);
      --text-primary: oklch(0.15 0.01 60);
      --text-secondary: oklch(0.45 0.01 60);
      --outline: oklch(0.85 0.01 60);
    }

    html.dark {
      --surface: oklch(0.10 0.01 60);
      --text-primary: oklch(0.96 0.005 60);
      --text-secondary: oklch(0.65 0.01 60);
      --outline: oklch(0.22 0.01 60);
    }

    html {
      background: radial-gradient(ellipse 80% 60% at 0% 0%,
          color-mix(in oklch, var(--brand) 18%, transparent) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 100% 100%,
          oklch(0.68 0.14 235 / 0.14) 0%, transparent 55%),
        var(--surface);
      background-attachment: fixed;
      min-height: 100vh;
      min-height: 100svh;
      font-family: system-ui, -apple-system, sans-serif;
      color: var(--text-primary);
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 16px;
      max-width: 480px;
    }

    .bubble {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: color-mix(in oklch, var(--brand) 12%, transparent);
      border: 1px solid color-mix(in oklch, var(--brand) 25%, transparent);
      color: var(--brand);
      font-size: 28px;
      margin-bottom: 8px;
    }

    .status {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--brand);
    }

    h1 {
      font-size: clamp(1.5rem, 4vw, 2.25rem);
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.15;
    }

    p {
      font-size: 1rem;
      color: var(--text-secondary);
      line-height: 1.6;
      max-width: 360px;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 8px;
    }

    a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: opacity 0.15s;
    }

    a:hover { opacity: 0.8; }

    .btn-primary {
      background: var(--brand);
      color: #fff;
      border: none;
    }

    .btn-outline {
      border: 1px solid var(--outline);
      color: var(--text-primary);
    }

    <script>
      /* Apply stored theme immediately */
      (function(){try{
        var s=localStorage.getItem('ca-scheme');
        var scheme=s?JSON.parse(s):'dark';
        var resolved=scheme==='system'
          ?(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')
          :scheme;
        if(resolved==='dark')document.documentElement.classList.add('dark');
      }catch(e){}}());
    </script>
  </style>
</head>
<body>
  <div class="card">
    <div class="bubble">⚠</div>
    <p class="status">%sveltekit.status%</p>
    <h1>Something went wrong</h1>
    <p>%sveltekit.error.message%</p>
    <div class="actions">
      <a href="javascript:history.back()" class="btn-outline">← Go back</a>
      <a href="/" class="btn-primary">Home</a>
    </div>
  </div>
</body>
</html>
