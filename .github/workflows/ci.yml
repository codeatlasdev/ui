name: CI
# PAUSED while the project is pre-stable: disabled in GitHub (gh workflow enable ci.yml to resume,
# then re-add "CI ok" as a required check in the main ruleset). See CONTRIBUTING.md.
# Runner-native (ubuntu-24.04, no containers): one build shared through artifacts, browser suites
# sharded, jobs skipped when the files they cover did not change. Branch rules require only
# "CI ok", so shards can change without touching repository settings. Runs on fork PRs too.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: "Regenerate visual baselines and commit them"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Changed areas
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pull-requests: read
    outputs:
      package: ${{ steps.filter.outputs.package }}
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          # Anything shared (lockfile, root config, CI) counts as a package change: run everything.
          filters: |
            package:
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - 'tsconfig.json'
              - 'biome.json'
              - 'scripts/**'
              - '.github/workflows/**'
            site:
              - 'site/**'

  build:
    name: Validate + build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --no-banner --redact --config .gitleaks.toml .
      - uses: ./.github/actions/setup
        # OG cards are rendered with Chromium at build time.
        with:
          browsers: chromium
      # Builds the package first (phase 0), then types, lint, unit, size.
      - run: bun run validate
      - run: bun run --cwd site build
      - uses: actions/upload-artifact@v7
        with:
          name: build
          retention-days: 3
          include-hidden-files: true
          path: |
            packages/ui/dist/
            site/dist/

  components:
    name: Component tests (${{ matrix.shard }}/2)
    needs: changes
    if: ${{ !inputs.update-snapshots && needs.changes.outputs.package == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          browsers: chromium
      - run: bun run build:pkg
      - run: bun run --cwd packages/ui test:browser --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: vitest-traces-${{ matrix.shard }}
          include-hidden-files: true
          path: |
            packages/ui/.vitest/
            packages/ui/src/**/__traces__/

  site:
    name: Site ${{ matrix.suite }} (${{ matrix.shard }}/${{ matrix.total }})
    needs: [changes, build]
    # Docs-only or repo-meta changes (AGENTS.md, skills, issue templates) skip the browser suites.
    if: ${{ !inputs.update-snapshots && (needs.changes.outputs.package == 'true' || needs.changes.outputs.site == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      E2E_PREBUILT: "1"
    strategy:
      fail-fast: false
      matrix:
        # Playwright splits shards by test count, not cost: the per-route a11y tests (3 axe
        # passes each) get their own shards so no job collects all of them.
        include:
          - { suite: e2e, projects: "--project=desktop --project=mobile --project=iphone", browsers: chromium webkit, shard: 1, total: 2 }
          - { suite: e2e, projects: "--project=desktop --project=mobile --project=iphone", browsers: chromium webkit, shard: 2, total: 2 }
          - { suite: a11y, projects: "--project=a11y", browsers: chromium, shard: 1, total: 3 }
          - { suite: a11y, projects: "--project=a11y", browsers: chromium, shard: 2, total: 3 }
          - { suite: a11y, projects: "--project=a11y", browsers: chromium, shard: 3, total: 3 }
    steps:
      - uses: actions/checkout@v7
      # The iphone project runs on WebKit.
      - uses: ./.github/actions/setup
        with:
          browsers: ${{ matrix.browsers }}
      - uses: actions/download-artifact@v8
        with:
          name: build
      - working-directory: site
        run: bunx playwright test ${{ matrix.projects }} --shard=${{ matrix.shard }}/${{ matrix.total }}
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-${{ matrix.suite }}-${{ matrix.shard }}
          include-hidden-files: true
          path: |
            site/playwright-report/
            site/test-results/

  visual:
    name: Visual regression (${{ matrix.suite }})
    needs: [changes, build]
    # Pixels only change when code, styles or the site change; always run when regenerating.
    # Baselines are rendered only here (ubuntu-24.04 pinned: fonts/libs come from the image).
    if: ${{ inputs.update-snapshots || needs.changes.outputs.package == 'true' || needs.changes.outputs.site == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      E2E_PREBUILT: "1"
    strategy:
      fail-fast: false
      matrix:
        suite: [components, site]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          browsers: chromium
      - uses: actions/download-artifact@v8
        with:
          name: build
      - if: ${{ matrix.suite == 'components' }}
        run: bun run --cwd packages/ui test:vrt ${{ inputs.update-snapshots && '--update' || '' }}
      - if: ${{ matrix.suite == 'site' }}
        working-directory: site
        run: bunx playwright test --project=visual-desktop --project=visual-mobile ${{ inputs.update-snapshots && '--update-snapshots' || '' }}
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-visual-${{ matrix.suite }}
          include-hidden-files: true
          path: |
            site/playwright-report/
            site/test-results/
            packages/ui/.vitest/
      - name: Commit updated baselines
        if: ${{ inputs.update-snapshots }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A '**/__screenshots__/**'
          git diff --cached --quiet || (git commit -m "test: update ${{ matrix.suite }} visual baselines" && git pull --rebase && git push)

  preview:
    name: Site preview
    # Fork PRs get no secrets; they still get the full test matrix above.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      # Puts the pinned wrangler (site devDependency) on the path; the action would try npm.
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: build
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: pages deploy dist --project-name codeatlas-ui --branch pr-${{ github.event.pull_request.number }}
      - name: Comment preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          URL: https://pr-${{ github.event.pull_request.number }}.codeatlas-ui.pages.dev
        run: |
          body="Site preview: $URL"
          gh pr comment ${{ github.event.pull_request.number }} --edit-last --body "$body" 2>/dev/null \
            || gh pr comment ${{ github.event.pull_request.number }} --body "$body"

  ok:
    name: CI ok
    # The single required check. Skipped jobs (path filters) count as passing; failures don't.
    if: ${{ always() }}
    needs: [build, components, site, visual]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: All required jobs passed or were skipped
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")'
