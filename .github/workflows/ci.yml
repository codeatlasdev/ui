name: CI
# After merge, not before (#859): the land gate is local (validate + affected tests on a tree rebased onto main),
# and these full suites run on main, where a red run is fixed forward. Releases still run the full suites locally.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: "Regenerate visual baselines and commit them"
        type: boolean
        default: false

# One group per commit: a group keeps a single pending run and cancels it when the next push arrives,
# so a land sequence left intermediate commits untested (#1023). Every push to main gets its full run.
concurrency:
  group: ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    name: Changed areas
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pull-requests: read
    outputs:
      # A manual run tests everything: paths-filter finds no change against the default branch (#1023).
      package: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.package == 'true' }}
      site: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.site == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          # Anything shared (lockfile, root config, CI) counts as a package change: run everything.
          filters: |
            package:
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - 'tsconfig.json'
              - 'biome.json'
              - 'scripts/**'
              - '.github/workflows/**'
            site:
              - 'site/**'

  build:
    name: Validate + build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --no-banner --redact --config .gitleaks.toml .
      - uses: ./.github/actions/setup
        # OG cards are rendered with Chromium at build time.
        with:
          browsers: chromium
      # Builds the package first (phase 0), then types, lint, unit, size. No wall-time budget on hosted
      # runners (budgets are measured on the owner's machine), same as the Release workflow's Verify.
      - run: bun scripts/validate.ts
      - run: bun run --cwd site build
      - uses: actions/upload-artifact@v7
        with:
          name: build
          retention-days: 3
          include-hidden-files: true
          path: |
            packages/ui/dist/
            site/dist/

  components:
    name: Component tests (${{ matrix.shard }}/2)
    needs: changes
    if: ${{ !inputs.update-snapshots && needs.changes.outputs.package == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          browsers: chromium
      - run: bun run build:pkg
      # CPU-throttled tests (`*.throttled.svelte.test.ts`) run in their own job: throttling multiplies the
      # runner's speed, and sharing its 4 cores with a full shard turned 150x into a timeout.
      - run: bun run --cwd packages/ui test:browser --shard=${{ matrix.shard }}/2 --exclude='**/*.throttled.svelte.test.ts'
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: vitest-traces-${{ matrix.shard }}
          include-hidden-files: true
          path: |
            packages/ui/.vitest/
            packages/ui/src/**/__traces__/

  throttled:
    name: Component tests (CPU throttled)
    needs: changes
    # 40x and 150x. On the 4-vCPU runner a 150x case once hung for 15 min with no output, outside every test timeout
    # (#844): the hook and teardown timeouts and the verbose reporter make the next hang name its test.
    if: ${{ !inputs.update-snapshots && needs.changes.outputs.package == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          browsers: chromium
      - run: bun run build:pkg
      # One worker: the throttled page is the only load on the runner. Verbose, so a hang names its test.
      - run: >-
          bun run --cwd packages/ui test:browser throttled --maxWorkers=1 --hookTimeout=120000 --teardownTimeout=60000
          --reporter=verbose

  site:
    name: Site ${{ matrix.suite }} (${{ matrix.shard }}/${{ matrix.total }})
    needs: [changes, build]
    # Docs-only or repo-meta changes (AGENTS.md, skills, issue templates) skip the browser suites.
    if: ${{ !inputs.update-snapshots && (needs.changes.outputs.package == 'true' || needs.changes.outputs.site == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      E2E_PREBUILT: "1"
    strategy:
      fail-fast: false
      matrix:
        # Playwright splits shards by test count, not cost: the per-route a11y tests (3 axe
        # passes each) get their own shards so no job collects all of them.
        include:
          - { suite: e2e, projects: "--project=desktop --project=mobile --project=iphone", browsers: chromium webkit, shard: 1, total: 2 }
          - { suite: e2e, projects: "--project=desktop --project=mobile --project=iphone", browsers: chromium webkit, shard: 2, total: 2 }
          - { suite: a11y, projects: "--project=a11y", browsers: chromium, shard: 1, total: 3 }
          - { suite: a11y, projects: "--project=a11y", browsers: chromium, shard: 2, total: 3 }
          - { suite: a11y, projects: "--project=a11y", browsers: chromium, shard: 3, total: 3 }
    steps:
      - uses: actions/checkout@v7
      # The iphone project runs on WebKit.
      - uses: ./.github/actions/setup
        with:
          browsers: ${{ matrix.browsers }}
      - uses: actions/download-artifact@v8
        with:
          name: build
      - working-directory: site
        run: node_modules/.bin/playwright test ${{ matrix.projects }} --shard=${{ matrix.shard }}/${{ matrix.total }}
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-${{ matrix.suite }}-${{ matrix.shard }}
          include-hidden-files: true
          path: |
            site/playwright-report/
            site/test-results/

  visual:
    name: Visual regression (${{ matrix.suite }})
    needs: [changes, build]
    # Pixels only change when code, styles or the site change; always run when regenerating.
    # Baselines are rendered only here (ubuntu-24.04 pinned: fonts/libs come from the image).
    # On demand only: baselines are native darwin renders compared locally and at release (AGENTS.md "Tests"); the
    # linux set is regenerated here when someone wants it, so it is never a merge check.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      E2E_PREBUILT: "1"
    strategy:
      fail-fast: false
      matrix:
        suite: [components, site]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          browsers: chromium
      - uses: actions/download-artifact@v8
        with:
          name: build
      - if: ${{ matrix.suite == 'components' }}
        run: bun run --cwd packages/ui test:vrt ${{ inputs.update-snapshots && '--update' || '' }}
      - if: ${{ matrix.suite == 'site' }}
        working-directory: site
        run: node_modules/.bin/playwright test --project=visual-desktop --project=visual-mobile ${{ inputs.update-snapshots && '--update-snapshots' || '' }}
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-visual-${{ matrix.suite }}
          include-hidden-files: true
          path: |
            site/playwright-report/
            site/test-results/
            packages/ui/.vitest/
      - name: Commit updated baselines
        if: ${{ inputs.update-snapshots }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A '**/__screenshots__/**'
          git diff --cached --quiet || (git commit -m "test: update ${{ matrix.suite }} visual baselines" && git pull --rebase && git push)

  ok:
    name: CI ok
    # The single required check. Skipped jobs (path filters) count as passing; failures don't.
    if: ${{ always() }}
    needs: [build, components, throttled, site]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: All required jobs passed or were skipped
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")'
