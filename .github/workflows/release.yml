name: Release
# A tag @codeatlasdev/ui@X.Y.Z (pushed by `bun run release:tag`) publishes that exact version to
# npm with provenance (Trusted Publishing, OIDC) and deploys the docs. Stable → dist-tag latest +
# ui.codeatlas.com.br; X.Y.Z-beta.N → dist-tag beta + beta.codeatlas-ui.pages.dev (same for any
# prerelease id). Nothing runs on branch pushes. Keep this filename: npm trusts release.yml.
on:
  push:
    tags: ["@codeatlasdev/ui@*"]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: write
      id-token: write # npm Trusted Publishing + provenance
    outputs:
      channel: ${{ steps.meta.outputs.channel }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # After install: setup-node's registry-url writes an .npmrc with a placeholder token
      # that bun also reads, which stalled the install. Trusted Publishing needs npm >= 11.5.1.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm i -g npm@latest
      - id: meta
        run: |
          v=$(node -p 'require("./packages/ui/package.json").version')
          [ "$GITHUB_REF_NAME" = "@codeatlasdev/ui@$v" ] || { echo "::error::tag $GITHUB_REF_NAME != package version $v"; exit 1; }
          case "$v" in *-*) channel=$(echo "$v" | sed -E 's/^[^-]+-([A-Za-z]+).*$/\1/');; *) channel=latest;; esac
          if [ "$channel" = latest ]; then
            git fetch -q origin main
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::stable tag must point to a commit on main"; exit 1; }
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - run: bun run build:pkg && node scripts/release.js --smoke
      - working-directory: packages/ui
        run: npm publish --provenance --access public --tag ${{ steps.meta.outputs.channel }}
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${GITHUB_REF_NAME#@codeatlasdev/ui@}
          bun scripts/changelog-notes.ts "$v" > /tmp/notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file /tmp/notes.md $([ "${{ steps.meta.outputs.channel }}" = latest ] || echo --prerelease)

  site:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: ${{ needs.publish.outputs.channel == 'latest' && 'production' || needs.publish.outputs.channel }}
      url: ${{ needs.publish.outputs.channel == 'latest' && 'https://ui.codeatlas.com.br' || format('https://{0}.codeatlas-ui.pages.dev', needs.publish.outputs.channel) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: bun run build
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: pages deploy dist --project-name codeatlas-ui --branch ${{ needs.publish.outputs.channel == 'latest' && 'main' || needs.publish.outputs.channel }}
