name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}
# CD only. A tag @codeatlasdev/ui@X.Y.Z (pushed by `bun run release:tag`) publishes that exact
# version, or dispatch by hand for an existing tag (re-run after a failure):
#   gh workflow run release.yml -f tag=@codeatlasdev/ui@X.Y.Z
# verify → publish (npm, provenance via Trusted Publishing/OIDC) → GitHub Release + docs deploy.
# Stable → dist-tag latest + ui.codeatlas.com.br (tag must be on main); X.Y.Z-beta.N → dist-tag beta
# + beta.codeatlas-ui.pages.dev (any prerelease id). Every step is idempotent: re-running a
# half-finished release skips what already exists. Keep this filename: npm trusts release.yml.
on:
  push:
    tags: ["@codeatlasdev/ui@*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (@codeatlasdev/ui@X.Y.Z[-pre.N])
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # CI is paused, so the release gates itself: the full validate + tarball smoke test on the tag.
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: meta
        name: Version and channel
        run: |
          v=$(node -p 'require("./packages/ui/package.json").version')
          [ "$TAG" = "@codeatlasdev/ui@$v" ] || { echo "::error::tag $TAG != package version $v"; exit 1; }
          case "$v" in *-*) channel=$(echo "$v" | sed -E 's/^[^-]+-([A-Za-z]+).*$/\1/');; *) channel=latest;; esac
          if [ "$channel" = latest ]; then
            git merge-base --is-ancestor HEAD origin/main || { echo "::error::stable tag must point to a commit on main"; exit 1; }
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - run: bun run validate
      - run: node scripts/release.js --smoke
      - name: Pack
        working-directory: packages/ui
        run: mkdir -p ../../pack && npm pack --pack-destination ../../pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: pack/*.tgz
          retention-days: 7

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      id-token: write # npm Trusted Publishing + provenance
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm >= 11.5.1.
      - run: npm i -g npm@latest
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - env:
          V: ${{ needs.verify.outputs.version }}
          CHANNEL: ${{ needs.verify.outputs.channel }}
        run: |
          if npm view "@codeatlasdev/ui@$V" version >/dev/null 2>&1; then
            echo "::notice::@codeatlasdev/ui@$V is already on npm; skipping publish"
          else
            npm publish ./*.tgz --provenance --access public --tag "$CHANNEL"
          fi

  github-release:
    name: GitHub Release
    needs: [verify, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # the only job that may create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: pack/
      - env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.verify.outputs.version }}
          CHANNEL: ${{ needs.verify.outputs.channel }}
        run: |
          {
            bun scripts/changelog-notes.ts "$V"
            printf '\n## Install\n\n```bash\nbun add @codeatlasdev/ui@%s\n```\n' "$V"
          } > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
            gh release upload "$TAG" pack/*.tgz --clobber
          else
            flags=$([ "$CHANNEL" = latest ] && echo --latest || echo --prerelease)
            gh release create "$TAG" pack/*.tgz --verify-tag --title "$TAG" --notes-file notes.md $flags
          fi

  site:
    name: Deploy docs
    needs: [verify, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: ${{ needs.verify.outputs.channel == 'latest' && 'production' || needs.verify.outputs.channel }}
      url: ${{ needs.verify.outputs.channel == 'latest' && 'https://ui.codeatlas.com.br' || format('https://{0}.codeatlas-ui.pages.dev', needs.verify.outputs.channel) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run build
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: pages deploy dist --project-name codeatlas-ui --branch ${{ needs.verify.outputs.channel == 'latest' && 'main' || needs.verify.outputs.channel }}
