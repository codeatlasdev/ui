[install]
exact = true

# Unit tests run on `bun test` (no browser needed). Browser components and visual tests need a
# real Chromium, so they stay on Vitest: `bun run test:browser` / `bun run test:vrt`.
# `*.svelte.test.ts` and `*.vrt.test.ts` live under src/ and are not matched by these roots.
[test]
root = "packages/ui/tests"
preload = ["./packages/ui/tests/setup.unit.ts"]
