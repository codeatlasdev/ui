# Git hooks. pre-commit formats staged files, commit-msg enforces Conventional Commits,
# pre-push checks the diff (Biome + affected unit tests); `validate` runs on the PR (pr.yml) and in the land gate.
pre-commit:
  jobs:
    - name: biome (staged)
      glob: "*.{ts,js,json}"
      run: bunx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
commit-msg:
  jobs:
    - name: conventional commit
      run: bun scripts/commit-msg.ts {1}
pre-push:
  jobs:
    - name: quick check (Biome + affected unit tests)
      run: bun scripts/pre-push.ts
