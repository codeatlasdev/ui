# Git hooks. Commits are never blocked; only `git push` runs the gate.
# Same checks as CI (.github/workflows/ci.yml), scoped to what the push changes.
# Skip once with `LEFTHOOK=0 git push` or `git push --no-verify`.
pre-push:
  parallel: false
  jobs:
    - name: validate (themes, types, lint, unit, build, size)
      run: bun run validate
    - name: component tests (Chromium)
      # Only when the pushed commits touch the package or shared tooling.
      files: git diff --name-only @{push}..HEAD 2>/dev/null || git diff --name-only origin/main...HEAD
      glob:
        - "packages/**"
        - "package.json"
        - "bun.lock"
      run: bun run test:browser
