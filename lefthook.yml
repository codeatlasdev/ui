# Git hooks. pre-commit formats staged files, commit-msg enforces Conventional Commits,
# pre-push runs `bun run validate` (types, lint, unit, build, size). Browser suites run on CI.
pre-commit:
  jobs:
    - name: biome (staged)
      glob: "*.{ts,js,json}"
      run: bunx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
commit-msg:
  jobs:
    - name: conventional commit
      run: bun scripts/commit-msg.ts {1}
pre-push:
  jobs:
    - name: validate (themes, types, lint, unit, build, size)
      run: bun run validate
